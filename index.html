<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klondike – Aplikace</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #f59e0b;
      --text: #f1f5f9;
      --hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: 0.2s ease;
      text-decoration: none;
      color: var(--text);
      display: block;
      border: 2px solid transparent;
    }

    .card:hover {
      background: var(--hover);
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .card h2 {
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }

    .card p {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Klondike 2026 – Aplikace</h1>

    <a class="card" href="https://pfait33.github.io/cth/">
      <h2>🏁 Bodování CTH</h2>
      <p>Celotáborová hra – závodní systém Formule 1</p>
    </a>

    <a class="card" href="https://pfait33.github.io/banka/">
      <h2>🏦 Bankovní aplikace</h2>
      <p>Ekonomika hry Kasino – měna Frfy</p>
    </a>

    <footer>
      © 2026 Klondike
    </footer>
  </div>
</body>
</html>
